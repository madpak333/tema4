<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klubber – DMJU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="clubs-page">
  <div id="site-header"></div>
  <main>
    <section class="clubs-hero">
      <img src="images/image.png" alt="Modeljernbane i landskab">
      <div class="clubs-hero-overlay"></div>
      <div class="container-fluid clubs-heading">
        <h1>Find en modeljernbaneklub<br>nær dig</h1>
        <p>Udforsk jernbaneklubber i hele<br>Danmark, og find et fællesskab<br>tæt på dig.</p>
      </div>
    </section>
    <section class="container-fluid clubs-content">
      <div class="row align-items-center club-filters">
        <div class="col-lg-4">
          <label class="visually-hidden" for="club-search">Søg</label>
          <div class="input-group">
            <span class="input-group-text">⌕</span>
            <input id="club-search" class="form-control" placeholder="Søg">
          </div>
        </div>
        <div class="col-lg-8">
          <div class="region-pills row g-3">
            <div class="col-4"><button class="btn w-100" type="button" data-region="Sjælland">Sjælland</button></div>
            <div class="col-4"><button class="btn w-100" type="button" data-region="Fyn">Fyn</button></div>
            <div class="col-4"><button class="btn w-100" type="button" data-region="Jylland">Jylland</button></div>
          </div>
          <select id="region" class="visually-hidden" aria-hidden="true">
            <option>Alle områder</option>
            <option>Sjælland</option>
            <option>Fyn</option>
            <option>Jylland</option>
          </select>
        </div>
      </div>
      <div id="club-list" class="row g-4"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
